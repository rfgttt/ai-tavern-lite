services:
  app:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      AI_TAVERN_ENVIRONMENT: production
      AI_TAVERN_HOST: 0.0.0.0
      AI_TAVERN_DATABASE_URL: sqlite:////app/backend/data/ai_tavern.db
      AI_TAVERN_ALLOWED_HOSTS: ${DOMAIN:?Set DOMAIN in .env.production},localhost,127.0.0.1
      AI_TAVERN_CORS_ORIGINS: ""
      AI_TAVERN_AUTH_ENABLED: "true"
      AI_TAVERN_RATE_LIMIT_ENABLED: "true"
      AI_TAVERN_ENABLE_DIAGNOSTICS: "false"
      AI_TAVERN_ENABLE_SELFTEST: "false"
      AI_TAVERN_ALLOW_SETTINGS_WRITE: "false"
      AI_TAVERN_ALLOW_PRIVATE_LLM_HOSTS: "false"
      AI_TAVERN_CREATE_DEMO_DATA: "false"
    volumes:
      - app_data:/app/backend/data
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  app_data:
  caddy_data:
  caddy_config:
